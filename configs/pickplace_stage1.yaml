env:
  env_id: SO101PickPlace-v0
  model_path: assets/so101/pickplace_scene.xml
  control_freq: 25.0
  action_mode: delta
  action_scale: 0.12
  gripper_action_scale: 0.25 # close in ~3 steps; STS3215 can do ~5 rad/s
  action_joints:
  - shoulder_pan
  - shoulder_lift
  - elbow_flex
  - wrist_flex
  - wrist_roll
  - gripper
  gripper_hold: 1.0
  max_episode_steps: 320 # it was 300
  target_low:
  - 0.12
  - -0.22
  - 0.06
  target_high:
  - 0.34
  - 0.22
  - 0.32
  success_threshold: 0.04
  success_hold_steps: 5
  init_qpos: null
  init_qpos_noise: 0.05
  obs_joint_noise_std: 0.0
  obs_vel_noise_std: 0.0
  include_last_action: true
  self_collision: false
  fix_gripper_collision: true # rebuild jaw collision (hulled meshes can't grasp)
  w_dist: 1.0
  w_near: 0.4
  near_scale: 0.05
  w_ctrl: 0.01
  w_vel: 0.0015
  # must clearly beat the per-step return of holding the cup at the goal
  # (~6.3/step), else the policy hovers instead of placing
  success_bonus: 8.0
  cup_init_low:
  - 0.2
  - -0.12
  cup_init_high:
  - 0.28
  - 0.12
  goal_low:
  - 0.18
  - -0.14
  goal_high:
  - 0.3
  - 0.14
  cup_rest_z: 0.025
  min_cup_goal_sep: 0.12
  opposite_sides: true # red start pad one side, green goal the other
  side_min_y: 0.06
  grasp_dist: 0.035
  lift_thresh: 0.02
  lift_target: 0.08 # carry height target; higher just encourages hovering
  lift_fade_dist: 0.1 # lift bonus fades near goal so descent is free
  place_height_tol: 0.02
  cup_speed_thresh: 0.08
  min_lift_for_success: 0.06 # no credit for shoving the cup onto the pad
  grasp_init_prob: 0.25
  hold_init_prob: 0.25
  place_init_prob: 0.0 # stage 1: no place starts — they starve approach learning
  w_reach: 1.0
  reach_scale: 0.06
  w_contact: 0.5 # per jaw touching the cup -> max 1.0
  w_lift: 2.0 # normalized by lift_target (was 4.0 unnormalized)
  w_grasp: 1.0
  w_transport: 1.5
  transport_scale: 0.1
  place_free_radius: 0.06 # holding income continues here even unlifted (set-down)
  spill_tilt: 0.45 # ~26 deg: fluid spills, episode over
  place_tilt: 0.15 # placed requires the cup upright
  w_upright: 1.0 # dense keep-it-level shaping
dr:
  enabled: true
  mass_scale:
  - 0.8
  - 1.2
  inertia_scale:
  - 0.8
  - 1.2
  damping_scale:
  - 0.5
  - 1.6
  frictionloss_scale:
  - 0.5
  - 1.6
  armature_scale:
  - 0.7
  - 1.4
  gain_scale:
  - 0.8
  - 1.2
  kv_scale:
  - 0.8
  - 1.2
  gravity_std: 0.15
  action_latency_steps:
  - 0
  - 2
  action_noise_std: 0.01
train:
  algo: ppo
  total_timesteps: 5000000
  n_envs: 8
  seed: 0
  device: auto
  n_steps: 512
  batch_size: 1024
  n_epochs: 10 # 28 over-updated and destabilized PPO on this task
  gamma: 0.98
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.0 # v3-proven; 0.002 measurably slowed early grasp learning (v7)
  log_std_init: -1.0 # std 0.37: gentle enough that a grip survives exploration
  learning_rate: 0.0003
  buffer_size: 1000000
  learning_starts: 10000
  train_freq: 1
  tau: 0.005
  policy_hidden:
  - 256
  - 256
  normalize_obs: true
  normalize_reward: true
  eval_freq: 25000
  n_eval_episodes: 20
  save_freq: 100000
  log_dir: outputs
  run_name: null
deploy:
  port: /dev/ttyACM0
  baudrate: 1000000
  servo_ids:
  - 1
  - 2
  - 3
  - 4
  - 5
  - 6
  ticks_per_rev: 4096
  center_ticks:
  - 2048
  - 2048
  - 2048
  - 2048
  - 2048
  - 2048
  joint_sign:
  - 1
  - 1
  - 1
  - 1
  - 1
  - 1
  max_step_rad: 0.15
  torque_limit: 0.5
  control_freq: 25.0
